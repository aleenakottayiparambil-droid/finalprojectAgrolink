<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AgroLink AI - My Products</title>

    <link rel="stylesheet" href="farmer.css">
</head>

<body>

    <div class="dashboard">

        <!-- =========================
             SIDEBAR
        ========================== -->

        <aside class="sidebar">

            <div class="logo-section">

                <div class="logo-icon">
                    🌱
                </div>

                <div>
                    <h2>AgroLink AI</h2>
                    <span>FARMER PORTAL</span>
                </div>

            </div>


            <nav>

                <button
                    class="nav-item"
                    onclick="window.location.href='farmer.html'"
                >
                    🏠
                    <span>Dashboard</span>
                </button>


                <button
                    class="nav-item"
                    onclick="window.location.href='add-product.html'"
                >
                    ➕
                    <span>Add Product</span>
                </button>


                <button class="nav-item active">

                    📦
                    <span>My Products</span>

                </button>


                <button class="nav-item">

                    🛒
                    <span>Orders</span>

                </button>


                <button class="nav-item">

                    🌾
                    <span>Government Schemes</span>

                </button>


                <button class="nav-item">

                    🔬
                    <span>Crop Disease Detection</span>

                </button>

            </nav>


            <button
                id="logoutBtn"
                class="logout-btn"
            >
                🚪 Logout
            </button>

        </aside>



        <!-- =========================
             MAIN CONTENT
        ========================== -->

        <main class="main-content">


            <!-- TOP BAR -->

            <header class="topbar">

                <div>

                    <h1>
                        My Products
                    </h1>

                    <p>
                        Manage the products you have
                        listed in the marketplace.
                    </p>

                </div>


                <div class="profile">

                    <div class="profile-icon">
                        👨‍🌾
                    </div>

                    <span id="profileName">
                        Farmer
                    </span>

                </div>

            </header>



            <!-- =========================
                 PRODUCTS SECTION
            ========================== -->

            <section class="section">


                <div class="section-header">

                    <div>

                        <h2>
                            Your Products
                        </h2>

                        <p>
                            Products currently listed
                            for consumers.
                        </p>

                    </div>


                    <button
                        class="product-submit-btn"
                        onclick="window.location.href='add-product.html'"
                    >
                        + Add Product
                    </button>

                </div>



                <!-- PRODUCTS WILL BE LOADED HERE -->

                <div id="productsContainer">

                    <div class="empty-marketplace">

                        <div class="empty-icon">
                            ⏳
                        </div>

                        <h3>
                            Loading products...
                        </h3>

                        <p>
                            Please wait while we load
                            your products.
                        </p>

                    </div>

                </div>

            </section>

        </main>

    </div>



    <!-- JAVASCRIPT -->

    <script src="my-products.js"></script>

</body>

</html>
