<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AgroLink AI - Marketplace</title>

    <link rel="stylesheet" href="consumer.css">
</head>

<body>

    <div class="dashboard">

        <!-- =========================
             SIDEBAR
        ========================== -->

        <aside class="sidebar">

            <div class="logo-section">

                <div class="logo-icon">
                    🌱
                </div>

                <div>
                    <h2>AgroLink AI</h2>
                    <span>CONSUMER PORTAL</span>
                </div>

            </div>


            <nav>

                <button
                    class="nav-item"
                    onclick="window.location.href='consumer.html'"
                >
                    🏠
                    <span>Dashboard</span>
                </button>


                <button class="nav-item active">

                    🛒
                    <span>Marketplace</span>

                </button>


                <button
    class="nav-item"
    onclick="window.location.href='orders.html'">
    📦
    <span>My Orders</span>
</button>


                <button
    class="nav-item"
    onclick="window.location.href='cart.html'">
    🛍️
    <span>Cart</span>
</button>

            </nav>


            <button
                id="logoutBtn"
                class="logout-btn"
            >
                🚪 Logout
            </button>

        </aside>



        <!-- =========================
             MAIN CONTENT
        ========================== -->

        <main class="main-content">


            <!-- TOP BAR -->

            <header class="topbar">

                <div>

                    <h1>
                        Marketplace
                    </h1>

                    <p>
                        Fresh agricultural products
                        directly from farmers.
                    </p>

                </div>


                <div class="profile">

                    <div class="profile-icon">
                        🛒
                    </div>

                    <span id="profileName">
                        Consumer
                    </span>

                </div>

            </header>



            <!-- =========================
                 MARKETPLACE
            ========================== -->

            <section class="section">


                <div class="section-header">

                    <div>

                        <h2>
                            Available Products
                        </h2>

                        <p>
                            Browse fresh products
                            available from farmers.
                        </p>

                    </div>

                </div>



                <!-- PRODUCTS -->

                <div
                    id="marketplaceContainer"
                    class="marketplace-grid"
                >

                    <div class="empty-marketplace">

                        <div class="empty-icon">
                            ⏳
                        </div>

                        <h3>
                            Loading products...
                        </h3>

                        <p>
                            Please wait while we load
                            the marketplace.
                        </p>

                    </div>

                </div>

            </section>

        </main>

    </div>


    <script src="marketplace.js"></script>

</body>

</html>
