<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Farmer Orders - AgroLink AI</title>

    <link rel="stylesheet" href="farmer.css">
</head>

<body>

    <div class="dashboard">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <div class="logo-section">
                <div class="logo-icon">🌱</div>

                <div>
                    <h2>AgroLink AI</h2>
                    <span>FARMER PORTAL</span>
                </div>
            </div>

            <nav>

                <button class="nav-item"
                    onclick="window.location.href='farmer.html'">
                    🏠 <span>Dashboard</span>
                </button>

                <button class="nav-item"
                    onclick="window.location.href='add-product.html'">
                    ➕ <span>Add Product</span>
                </button>

                <button class="nav-item"
                    onclick="window.location.href='my-products.html'">
                    📦 <span>My Products</span>
                </button>

                <button class="nav-item active">
                    🧾 <span>Orders</span>
                </button>

                <button class="nav-item">
                    🌿 <span>Government Schemes</span>
                </button>

                <button class="nav-item">
                    🔬 <span>Crop Disease Detection</span>
                </button>

            </nav>

            <button id="logoutBtn" class="logout-btn">
                🚪 Logout
            </button>

        </aside>


        <!-- MAIN CONTENT -->
        <main class="main-content">

            <header class="topbar">

                <div>
                    <h1>Customer Orders</h1>
                    <p>View orders for your listed products.</p>
                </div>

                <div class="profile">
                    <div class="profile-icon">👤</div>
                    <span id="profileName">Farmer</span>
                </div>

            </header>


            <section class="content-section">

                <div id="farmerOrdersContainer">

                    <div class="empty-marketplace">
                        <div class="empty-icon">📦</div>

                        <h3>Loading orders...</h3>

                        <p>
                            Please wait while we retrieve your orders.
                        </p>
                    </div>

                </div>

            </section>

        </main>

    </div>

    <script src="farmer-orders.js"></script>

</body>

</html>
